server:
  port: 8080
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
        cookie:
          max-age: 2592000
spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: yun-picture-backend
  #数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hhh_picture
    username: root
    password: 123456
  #redis配置
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 10000
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000

mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: false
    #仅在开发环境打印日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

#接口文档配置
knife4j:
  enable: true
  openapi:
    title: 云图库接口文档
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.hhh.yunpicturebackend.controller

